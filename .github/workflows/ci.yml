name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: "0 20 * * 1" # weekly supply-chain audit even without commits

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Unit tests (incl. LLM output-contract tests)
        run: pytest -q
      - name: Golden-set eval — fast-pattern tier
        run: python3 eval/run_eval.py --rules

  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Audit Python dependencies
        run: |
          pip install pip-audit
          pip-audit -r requirements-dev.txt
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - name: Audit npm dependencies (keytar helper)
        run: npm audit --audit-level=high
